# Separate site. Do NOT put this inside the Jackpot Jungle config.
# Listen on 8088 so port 80 / the other app stays as it is.
server {
    listen 8088;
    listen [::]:8088;
    server_name 157.245.93.210 157-245-93-210.sslip.io;

    root /home/deploy/bulkzen;
    index index.php;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~* /(logs|uploads)/.*\.(php|sql|json|log)$ {
        deny all;
    }
}
